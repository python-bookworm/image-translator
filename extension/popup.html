<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>图片翻译设置</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <form id="settingsForm">
      <h1>图片翻译</h1>
      <label>
        服务地址
        <input id="apiBaseUrl" type="url" required placeholder="http://127.0.0.1:8080">
      </label>
      <label>
        源语言
        <select id="sourceLanguage"></select>
      </label>
      <label>
        目标语言
        <select id="targetLanguage"></select>
      </label>
      <div class="footer">
        <span id="message"></span>
        <div class="buttons">
          <button id="testConnection" class="secondary" type="button">测试连接</button>
          <button type="submit">保存</button>
        </div>
      </div>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
